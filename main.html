<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            /* Or a solid color: background-color: #f4f7f6; */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Ensure body takes full viewport height */
        }

        .login-container {
            background-color: #ffffff;
            padding: 40px 50px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px; /* Max width for the form */
            text-align: center;
        }

        .login-container h2 {
            color: #333;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left; /* Align labels to the left */
            position: relative; /* Needed for potential icon positioning */
        }

        .input-group label {
            display: block; /* Label on its own line */
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 0.95em;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px; /* Comfortable padding */
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            color: #333;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .input-group input::placeholder {
            color: #aaa;
        }

        .input-group input:focus {
            outline: none; /* Remove default focus outline */
            border-color: #764ba2; /* Highlight color on focus */
            box-shadow: 0 0 8px rgba(118, 75, 162, 0.2); /* Subtle glow on focus */
        }

        .login-button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s ease, transform 0.2s ease;
            margin-top: 10px; /* Space above button */
        }

        .login-button:hover {
            opacity: 0.9; /* Slightly transparent on hover */
        }
        
        .login-button:active {
            transform: scale(0.98); /* Slight shrink effect on click */
        }

        .options {
            margin-top: 25px;
            font-size: 0.9em;
        }

        .options a {
            color: #667eea;
            text-decoration: none;
            margin: 0 10px;
            transition: color 0.3s ease;
        }

        .options a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

    </style>
</head>
<body>

    <div class="login-container">
        <h2>Login</h2>
        <!-- The form element is semantically correct, but action/method would depend on backend -->
        <form action="#" method="post"> <!-- Replace # with your backend endpoint -->
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="login-button">Login</button>

            <div class="options">
                <a href="#">Forgot Password?</a>
                <span>|</span>
                <a href="#">Sign Up</a>
            </div>
        </form>
    </div>

</body>
</html>
