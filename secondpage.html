<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Second Page</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #333;
    }
    .card {
      background: #fff;
      width: 100%;
      max-width: 720px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      padding: 32px 36px;
      text-align: center;
    }
    h1 { font-size: 1.8rem; margin-bottom: 12px; }
    p { color: #555; margin-bottom: 24px; line-height: 1.6; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a.button {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      transition: transform .2s ease, opacity .2s ease, background-color .3s ease, color .3s ease;
    }
    a.primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
    }
    a.primary:hover { opacity: .92; }
    a.secondary {
      background: #fff;
      color: #764ba2;
      border: 2px solid #764ba2;
    }
    a.secondary:hover { background: #f0eafa; color: #667eea; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Second Page</h1>
    <p>This is a sample second page. You can add your content here, such as a profile, dashboard, or any additional sections.</p>
    <div class="actions">
      <a class="button primary" href="/">Back to Home</a>
      <a class="button secondary" href="main.html">Open main.html</a>
    </div>
  </main>
</body>
</html>
