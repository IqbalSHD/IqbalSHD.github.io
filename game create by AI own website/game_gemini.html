<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Voidfall</title>
    
    <!-- Tailwind CSS for styling the UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">

    <style>
        /* Custom styles for the game */
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0a0a0a;
            color: #e5e5e5;
        }

        #gameCanvas {
            position: fixed;
            top: 0;
            left: 0;
            outline: none;
            display: block;
        }

        /* UI elements styling */
        .ui-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
        }
        
        .ui-panel.hidden {
            opacity: 0;
            transform: translate(-50%, -40%);
            pointer-events: none;
        }

        .game-title {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: -0.05em;
            background: -webkit-linear-gradient(45deg, #a855f7, #f472b6, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        .btn {
            display: inline-block;
            background-color: #a855f7;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }

        .btn:hover {
            background-color: #9333ea;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        }

        /* HUD Styling */
        #hud {
            position: fixed;
            top: 1rem;
            left: 1rem;
            right: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-size: 1.25rem;
            font-weight: 700;
            pointer-events: none;
            text-shadow: 0 0 5px rgba(0,0,0,0.7);
            transition: opacity 0.5s ease;
        }
        
        #hud.hidden {
            opacity: 0;
        }

        #healthBarContainer {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 15px;
            background-color: rgba(255,255,255,0.2);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.3);
            overflow: hidden;
        }

        #healthBar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #60a5fa, #3b82f6);
            transition: width 0.3s ease;
        }

        /* Virtual Joystick for Mobile */
        #joystickWrapper {
            position: fixed;
            bottom: 4rem;
            left: 4rem;
            width: 120px;
            height: 120px;
            background: rgba(20, 20, 20, 0.4);
            border-radius: 50%;
            display: none; /* Hidden by default, shown for touch devices */
            justify-content: center;
            align-items: center;
            border: 2px solid rgba(255,255,255,0.2);
        }

        #joystick {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            position: relative;
        }
        
        @media (max-width: 768px) {
            .ui-panel {
                width: 90%;
            }
            .game-title {
                font-size: 2.5rem;
            }
        }

    </style>
</head>
<body>

    <!-- The main canvas for the Three.js scene -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI Panels -->
    <div id="startMenu" class="ui-panel">
        <h1 class="game-title">VOIDFALL</h1>
        <p class="mb-6 text-neutral-400">Survive the asteroid field. Destroy the hostiles.</p>
        <div id="startButton" class="btn">Start Game</div>
        <p class="mt-8 text-xs text-neutral-500">
            Desktop: WASD to Move, Mouse to Aim, Click to Shoot<br>
            Mobile: Joystick to Move, Tap Right Side to Shoot
        </p>
    </div>

    <div id="gameOverMenu" class="ui-panel hidden">
        <h1 class="game-title">Game Over</h1>
        <p class="text-2xl font-bold mb-2">Final Score: <span id="finalScore">0</span></p>
        <p class="mb-6 text-neutral-400">The void claims another...</p>
        <div id="restartButton" class="btn">Play Again</div>
    </div>

    <!-- Heads-Up Display (HUD) -->
    <div id="hud" class="hidden">
        <div>Score: <span id="score">0</span></div>
        <div>Wave: <span id="wave">1</span></div>
    </div>
    <div id="healthBarContainer" class="hidden">
        <div id="healthBar"></div>
    </div>

    <!-- Virtual Joystick for mobile -->
    <div id="joystickWrapper">
        <div id="joystick"></div>
    </div>

    <!-- Import Three.js and post-processing modules from CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- GAME SETUP ---
        let scene, camera, renderer, composer;
        let player, playerVelocity = new THREE.Vector3();
        let clock = new THREE.Clock();
        let mouse = new THREE.Vector2();
        
        const bullets = [];
        const enemies = [];
        const asteroids = [];
        const particles = [];
        let score = 0;
        let wave = 1;
        let enemiesToSpawn = 5;
        let isGameOver = true;
        let playerHealth = 100;
        
        const PLAYER_SPEED = 5.0;
        const PLAYER_MAX_HEALTH = 100;

        // --- UI ELEMENTS ---
        const startMenu = document.getElementById('startMenu');
        const gameOverMenu = document.getElementById('gameOverMenu');
        const startButton = document.getElementById('startButton');
        const restartButton = document.getElementById('restartButton');
        const scoreEl = document.getElementById('score');
        const waveEl = document.getElementById('wave');
        const finalScoreEl = document.getElementById('finalScore');
        const hud = document.getElementById('hud');
        const healthBarContainer = document.getElementById('healthBarContainer');
        const healthBar = document.getElementById('healthBar');
        
        // --- MOBILE CONTROLS ---
        const joystickWrapper = document.getElementById('joystickWrapper');
        const joystick = document.getElementById('joystick');
        let joystickActive = false;
        let joystickData = { x: 0, y: 0 };
        const isTouchDevice = 'ontouchstart' in window;

        // --- INPUT HANDLING ---
        const keys = {};
        document.addEventListener('keydown', (e) => keys[e.code] = true);
        document.addEventListener('keyup', (e) => keys[e.code] = false);
        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });
        
        // --- INITIALIZATION ---
        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.015);

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 15;
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gameCanvas'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.toneMapping = THREE.ReinhardToneMapping;

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 2);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(5, 5, 5);
            scene.add(directionalLight);

            // Post-processing for bloom effect
            const renderPass = new RenderPass(scene, camera);
            const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.0, 0.1, 0.1);
            composer = new EffectComposer(renderer);
            composer.addPass(renderPass);
            composer.addPass(bloomPass);

            // Create game objects
            createPlayer();
            createStarfield();

            // Add event listeners for UI
            startButton.addEventListener('click', startGame);
            restartButton.addEventListener('click', startGame);

            // Setup mobile controls if needed
            if (isTouchDevice) {
                setupMobileControls();
            }

            // Start animation loop
            animate();
        }

        function startGame() {
            // Reset game state
            score = 0;
            wave = 1;
            playerHealth = PLAYER_MAX_HEALTH;
            isGameOver = false;
            player.visible = true;

            // Reset objects
            enemies.forEach(e => scene.remove(e.mesh));
            enemies.length = 0;
            bullets.forEach(b => scene.remove(b.mesh));
            bullets.length = 0;
            asteroids.forEach(a => scene.remove(a.mesh));
            asteroids.length = 0;

            // Player position and health
            player.position.set(0, 0, 0);
            playerVelocity.set(0, 0, 0);
            updateHealthBar();
            
            // UI updates
            startMenu.classList.add('hidden');
            gameOverMenu.classList.add('hidden');
            hud.classList.remove('hidden');
            healthBarContainer.classList.remove('hidden');
            
            // Initial spawn
            spawnAsteroids(20);
            spawnWave();
        }

        // --- GAME OBJECT CREATION ---
        function createPlayer() {
            const bodyGeo = new THREE.IcosahedronGeometry(0.6, 0);
            const cockpitGeo = new THREE.IcosahedronGeometry(0.2, 0);
            const wingGeo = new THREE.BoxGeometry(2, 0.1, 0.5);
            
            const mat = new THREE.MeshStandardMaterial({ color: 0xe5e5e5, flatShading: true });
            
            player = new THREE.Group();
            const body = new THREE.Mesh(bodyGeo, mat);
            const cockpit = new THREE.Mesh(cockpitGeo, new THREE.MeshStandardMaterial({ color: 0x60a5fa, emissive: 0x60a5fa, emissiveIntensity: 2 }));
            cockpit.position.z = 0.5;
            
            const leftWing = new THREE.Mesh(wingGeo, mat);
            leftWing.position.x = -0.7;
            const rightWing = new THREE.Mesh(wingGeo, mat);
            rightWing.position.x = 0.7;

            player.add(body);
            player.add(cockpit);
            player.add(leftWing);
            player.add(rightWing);
            
            player.collider = new THREE.Sphere(player.position, 0.8);
            scene.add(player);
        }

        function createStarfield() {
            const starCount = 5000;
            const positions = new Float32Array(starCount * 3);
            for (let i = 0; i < starCount; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 2000;
                positions[i * 3 + 1] = (Math.random() - 0.5) * 2000;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 2000;
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.5, transparent: true, opacity: 0.7 });
            const stars = new THREE.Points(geo, mat);
            scene.add(stars);
        }

        function createBullet(position, velocity) {
            const geo = new THREE.CapsuleGeometry(0.1, 0.5, 4, 8);
            const mat = new THREE.MeshBasicMaterial({ color: 0xf472b6, emissive: 0xf472b6, emissiveIntensity: 5 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(position);
            
            const bullet = {
                mesh,
                velocity,
                lifespan: 2, // seconds
                collider: new THREE.Sphere(mesh.position, 0.2)
            };
            bullets.push(bullet);
            scene.add(mesh);
        }

        function createEnemy(position) {
            const geo = new THREE.OctahedronGeometry(0.8, 0);
            const mat = new THREE.MeshStandardMaterial({ color: 0xfcba03, flatShading: true });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(position);

            const enemy = {
                mesh,
                health: 3,
                collider: new THREE.Sphere(mesh.position, 1.0)
            };
            enemies.push(enemy);
            scene.add(mesh);
        }

        function createAsteroid(position) {
            const size = Math.random() * 2 + 1;
            const geo = new THREE.IcosahedronGeometry(size, 1);
            const pos = geo.attributes.position;
            for(let i = 0; i < pos.count; i++) {
                const v = new THREE.Vector3().fromBufferAttribute(pos, i);
                v.multiplyScalar(1 + (Math.random() - 0.5) * 0.4);
                pos.setXYZ(i, v.x, v.y, v.z);
            }
            geo.computeVertexNormals();
            
            const mat = new THREE.MeshStandardMaterial({ color: 0x8a8a8a, flatShading: true });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(position);
            
            const asteroid = {
                mesh,
                velocity: new THREE.Vector3(
                    (Math.random() - 0.5) * 0.5,
                    (Math.random() - 0.5) * 0.5,
                    (Math.random() - 0.5) * 0.5
                ),
                rotationSpeed: new THREE.Vector3(
                    Math.random() * 0.01,
                    Math.random() * 0.01,
                    Math.random() * 0.01
                ),
                collider: new THREE.Sphere(mesh.position, size)
            };
            asteroids.push(asteroid);
            scene.add(mesh);
        }
        
        function createExplosion(position, count, color) {
            for (let i = 0; i < count; i++) {
                const particle = {
                    mesh: new THREE.Mesh(
                        new THREE.BoxGeometry(0.1, 0.1, 0.1),
                        new THREE.MeshBasicMaterial({ color: color })
                    ),
                    velocity: new THREE.Vector3(
                        (Math.random() - 0.5) * 5,
                        (Math.random() - 0.5) * 5,
                        (Math.random() - 0.5) * 5
                    ),
                    lifespan: Math.random() * 0.5 + 0.5
                };
                particle.mesh.position.copy(position);
                particles.push(particle);
                scene.add(particle.mesh);
            }
        }

        // --- SPAWNING LOGIC ---
        function spawnWave() {
            enemiesToSpawn = 5 + wave * 2;
            for (let i = 0; i < enemiesToSpawn; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = 30;
                const x = Math.cos(angle) * radius;
                const y = Math.sin(angle) * radius;
                createEnemy(new THREE.Vector3(x, y, 0));
            }
            waveEl.textContent = wave;
        }

        function spawnAsteroids(count) {
             for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * 50 + 20;
                const x = Math.cos(angle) * radius;
                const y = Math.sin(angle) * radius;
                const z = (Math.random() - 0.5) * 20;
                createAsteroid(new THREE.Vector3(x, y, z));
            }
        }

        // --- UPDATE & GAME LOGIC ---
        function update(deltaTime) {
            if (isGameOver) return;
            
            updatePlayer(deltaTime);
            updateBullets(deltaTime);
            updateEnemies(deltaTime);
            updateAsteroids(deltaTime);
            updateParticles(deltaTime);
            
            checkCollisions();

            // Check for next wave
            if (enemies.length === 0) {
                wave++;
                spawnWave();
                spawnAsteroids(5);
                playerHealth = Math.min(PLAYER_MAX_HEALTH, playerHealth + 25); // Heal between waves
                updateHealthBar();
            }
        }

        function updatePlayer(deltaTime) {
            // Get input direction
            const moveDirection = new THREE.Vector3(0, 0, 0);
            if (keys['KeyW'] || keys['ArrowUp']) moveDirection.y += 1;
            if (keys['KeyS'] || keys['ArrowDown']) moveDirection.y -= 1;
            if (keys['KeyA'] || keys['ArrowLeft']) moveDirection.x -= 1;
            if (keys['KeyD'] || keys['ArrowRight']) moveDirection.x += 1;
            
            // Apply joystick input if active
            if (joystickActive) {
                moveDirection.x += joystickData.x;
                moveDirection.y += joystickData.y;
            }
            
            moveDirection.normalize();

            // Apply velocity
            playerVelocity.add(moveDirection.multiplyScalar(PLAYER_SPEED * 10 * deltaTime));
            
            // Apply damping/friction
            playerVelocity.multiplyScalar(1 - 5 * deltaTime);

            player.position.add(playerVelocity.clone().multiplyScalar(deltaTime));

            // Aiming logic
            const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);
            const intersectPoint = new THREE.Vector3();
            raycaster.ray.intersectPlane(plane, intersectPoint);
            player.lookAt(intersectPoint);
            
            // Keep player within bounds
            const bounds = 20;
            player.position.x = Math.max(-bounds, Math.min(bounds, player.position.x));
            player.position.y = Math.max(-bounds, Math.min(bounds, player.position.y));
        }

        function updateBullets(deltaTime) {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                bullet.mesh.position.add(bullet.velocity.clone().multiplyScalar(deltaTime));
                bullet.lifespan -= deltaTime;
                if (bullet.lifespan <= 0) {
                    scene.remove(bullet.mesh);
                    bullets.splice(i, 1);
                }
            }
        }

        function updateEnemies(deltaTime) {
            enemies.forEach(enemy => {
                const direction = player.position.clone().sub(enemy.mesh.position).normalize();
                enemy.mesh.position.add(direction.multiplyScalar(2.5 * deltaTime));
                enemy.mesh.lookAt(player.position);
            });
        }
        
        function updateAsteroids(deltaTime) {
            asteroids.forEach(asteroid => {
                asteroid.mesh.position.add(asteroid.velocity);
                asteroid.mesh.rotation.x += asteroid.rotationSpeed.x;
                asteroid.mesh.rotation.y += asteroid.rotationSpeed.y;
                asteroid.mesh.rotation.z += asteroid.rotationSpeed.z;
                
                // Wrap around screen
                if (asteroid.mesh.position.length() > 100) {
                    asteroid.mesh.position.negate();
                }
            });
        }

        function updateParticles(deltaTime) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.mesh.position.add(p.velocity.clone().multiplyScalar(deltaTime));
                p.lifespan -= deltaTime;
                if (p.lifespan <= 0) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                }
            }
        }
        
        function checkCollisions() {
            // Bullets with enemies
            for (let i = bullets.length - 1; i >= 0; i--) {
                for (let j = enemies.length - 1; j >= 0; j--) {
                    if (bullets[i] && enemies[j] && bullets[i].collider.intersectsSphere(enemies[j].collider)) {
                        scene.remove(bullets[i].mesh);
                        bullets.splice(i, 1);
                        
                        enemies[j].health--;
                        if (enemies[j].health <= 0) {
                            createExplosion(enemies[j].mesh.position, 30, 0xfcba03);
                            scene.remove(enemies[j].mesh);
                            enemies.splice(j, 1);
                            score += 100;
                            scoreEl.textContent = score;
                        } else {
                            // Hit flash effect
                            enemies[j].mesh.material.emissive.setHex(0xffffff);
                            setTimeout(() => {
                                if (enemies[j]) enemies[j].mesh.material.emissive.setHex(0x000000);
                            }, 100);
                        }
                        break; 
                    }
                }
            }
            
            // Player with enemies and asteroids
            const allHazards = [...enemies, ...asteroids];
            for (let i = allHazards.length - 1; i >= 0; i--) {
                if(player.collider.intersectsSphere(allHazards[i].collider)) {
                    playerHit(20);
                    createExplosion(allHazards[i].mesh.position, 20, 0xffffff);
                    scene.remove(allHazards[i].mesh);
                    if (allHazards[i].health) enemies.splice(enemies.indexOf(allHazards[i]), 1);
                    else asteroids.splice(asteroids.indexOf(allHazards[i]), 1);
                }
            }
        }
        
        function playerHit(damage) {
            playerHealth -= damage;
            updateHealthBar();
            
            // Screen shake effect
            document.body.style.animation = 'shake 0.2s';
            setTimeout(() => document.body.style.animation = '', 200);

            if (playerHealth <= 0) {
                endGame();
            }
        }
        
        function updateHealthBar() {
            const healthPercentage = Math.max(0, playerHealth) / PLAYER_MAX_HEALTH;
            healthBar.style.width = `${healthPercentage * 100}%`;
        }

        function endGame() {
            isGameOver = true;
            createExplosion(player.position, 100, 0xffffff);
            player.visible = false;
            
            gameOverMenu.classList.remove('hidden');
            hud.classList.add('hidden');
            healthBarContainer.classList.add('hidden');
            finalScoreEl.textContent = score;
        }

        // --- ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            const deltaTime = clock.getDelta();
            
            update(deltaTime);

            // Render scene with post-processing
            composer.render();
        }

        // --- EVENT HANDLERS & HELPERS ---
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', onWindowResize);
        
        let shootTimeout;
        function handleShoot() {
            if (isGameOver || shootTimeout) return;
            
            // CORRECTED: The ship's front is its positive Z axis, so the bullet velocity should be positive.
            const bulletVelocity = new THREE.Vector3(0, 0, 1); 
            bulletVelocity.applyQuaternion(player.quaternion);
            bulletVelocity.multiplyScalar(30);
            
            const bulletPosition = player.position.clone().add(bulletVelocity.clone().normalize().multiplyScalar(1));
            createBullet(bulletPosition, bulletVelocity);
            
            shootTimeout = setTimeout(() => shootTimeout = null, 200); // Fire rate
        }
        
        document.addEventListener('mousedown', (e) => {
            if (e.button === 0) handleShoot();
        });

        function setupMobileControls() {
            joystickWrapper.style.display = 'flex';

            let joystickOrigin = { x: 0, y: 0 };

            joystickWrapper.addEventListener('touchstart', (e) => {
                e.preventDefault();
                joystickActive = true;
                const touch = e.touches[0];
                joystickOrigin = { x: touch.clientX, y: touch.clientY };
            }, { passive: false });

            joystickWrapper.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (!joystickActive) return;
                const touch = e.touches[0];
                const deltaX = touch.clientX - joystickOrigin.x;
                const deltaY = touch.clientY - joystickOrigin.y;
                
                const distance = Math.sqrt(deltaX*deltaX + deltaY*deltaY);
                const maxDistance = joystickWrapper.clientWidth / 2;
                
                const clampedX = Math.min(maxDistance, Math.max(-maxDistance, deltaX));
                const clampedY = Math.min(maxDistance, Math.max(-maxDistance, deltaY));
                
                joystick.style.transform = `translate(${clampedX}px, ${clampedY}px)`;
                
                joystickData.x = clampedX / maxDistance;
                joystickData.y = -clampedY / maxDistance; // Invert Y for screen coordinates
            }, { passive: false });
            
            const touchEndHandler = () => {
                joystickActive = false;
                joystick.style.transform = `translate(0px, 0px)`;
                joystickData = { x: 0, y: 0 };
            };
            joystickWrapper.addEventListener('touchend', touchEndHandler);
            joystickWrapper.addEventListener('touchcancel', touchEndHandler);
            
            // Right side of screen for shooting
            window.addEventListener('touchstart', (e) => {
                if (isGameOver) return;
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.clientX > window.innerWidth / 2) {
                        handleShoot();
                    }
                }
            });
        }
        
        // Add a keyframe animation for screen shake
        const styleSheet = document.createElement("style");
        styleSheet.type = "text/css";
        styleSheet.innerText = `
            @keyframes shake {
                0% { transform: translate(1px, 1px) rotate(0deg); }
                10% { transform: translate(-1px, -2px) rotate(-1deg); }
                20% { transform: translate(-3px, 0px) rotate(1deg); }
                30% { transform: translate(3px, 2px) rotate(0deg); }
                40% { transform: translate(1px, -1px) rotate(1deg); }
                50% { transform: translate(-1px, 2px) rotate(-1deg); }
                60% { transform: translate(-3px, 1px) rotate(0deg); }
                70% { transform: translate(3px, 1px) rotate(-1deg); }
                80% { transform: translate(-1px, -1px) rotate(1deg); }
                90% { transform: translate(1px, 2px) rotate(0deg); }
                100% { transform: translate(1px, -2px) rotate(-1deg); }
            }
        `;
        document.head.appendChild(styleSheet);


        // --- START THE GAME ---
        init();

    </script>
</body>
</html>
