<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>IqbalSHD • Home</title>
		<style>
			:root {
				--bg: #0b132b;
				--bg2: #0f2040;
				--card: #1c2541;
				--text: #e6edf6;
				--muted: #b9c2cf;
				--accent: #5bc0be;
				--accent2: #9b5de5;
			}
			* { box-sizing: border-box; }
			html, body { height: 100%; }
			body {
				margin: 0;
				font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial, "Apple Color Emoji", "Segoe UI Emoji";
				background: linear-gradient(180deg, var(--bg), var(--bg2));
				color: var(--text);
			}
			.container { max-width: 1100px; margin: 0 auto; padding: 32px 20px 48px; }
			header { display: grid; gap: 8px; margin-bottom: 16px; }
			h1 { margin: 0; font-size: 2rem; letter-spacing: 0.2px; }
			.sub { color: var(--muted); margin: 0; }
			section { margin-top: 28px; }
			section h2 { font-size: 1.1rem; font-weight: 600; margin: 0 0 10px; color: #dfe7f3; }
			.grid {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
				gap: 12px;
			}
			a.button {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				gap: 8px;
				padding: 14px 16px;
				border-radius: 12px;
				background: var(--card);
				color: var(--text);
				text-decoration: none;
				border: 1px solid rgba(255, 255, 255, 0.08);
				transition: transform 120ms ease, border-color 160ms ease, box-shadow 160ms ease;
				text-align: center;
			}
			a.button:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: 0 6px 20px rgba(91, 192, 190, 0.15); }
			.badge { font-size: 0.75rem; padding: 2px 8px; border-radius: 999px; background: rgba(91,192,190,0.18); color: var(--accent); border: 1px solid rgba(91,192,190,0.35); }
			footer { margin-top: 36px; color: var(--muted); font-size: 0.95rem; }
			.wrap { display: grid; gap: 18px; }
		</style>
	</head>
	<body>
		<div class="container">
			<header>
				<h1>IqbalSHD • Navigation</h1>
				<p class="sub">Quick links to portfolio and game pages.</p>
			</header>

			<section>
				<h2>Portfolio (GitHub Copilot)</h2>
				<div class="grid">
					<a class="button" href="portfolio%20create%20by%20github%20copilot/gpt5.html">GPT‑5 Portfolio</a>
					<a class="button" href="portfolio%20create%20by%20github%20copilot/sonnet4.html">Sonnet 4 Portfolio</a>
				</div>
			</section>

			<section>
				<h2>Games (AI‑generated)</h2>
				<div class="grid">
					<a class="button" href="game%20create%20by%20AI%20own%20website/game_gemini.html">Game: Gemini</a>
					<a class="button" href="game%20create%20by%20AI%20own%20website/game_gpt5.html">Game: GPT‑5</a>
					<a class="button" href="game%20create%20by%20AI%20own%20website/game_grok.html">Game: Grok</a>
					<a class="button" href="game%20create%20by%20AI%20own%20website/game_sonnet4.html">Game: Sonnet 4</a>
				</div>
			</section>

			<section>
				<h2>Games (GitHub Copilot)</h2>
				<div class="grid">
					<a class="button" href="game%20create%20by%20github%20copilot/gemini.html">Game: Gemini</a>
					<a class="button" href="game%20create%20by%20github%20copilot/gpt5.html">Game: GPT-5</a>
					<a class="button" href="game%20create%20by%20github%20copilot/sonnet4.html">Game: Sonnet 4</a>
				</div>
			</section>

			<footer>
				<div class="wrap">
					<div>Last updated: <span id="last-updated"></span></div>
				</div>
			</footer>
		</div>
		<script>
			// Small enhancement: render a friendly last-updated date in local time
			(function () {
				var el = document.getElementById('last-updated');
				if (!el) return;
				try {
					// If the site is served by GitHub Pages this reflects the build time.
					var d = new Date(document.lastModified);
					el.textContent = d.toLocaleString(undefined, {
						year: 'numeric', month: 'short', day: '2-digit', hour: '2-digit', minute: '2-digit'
					});
				} catch (_) { el.textContent = '—'; }
			})();
		</script>
	</body>
	</html>
