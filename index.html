<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Welcome — Portfolio</title>
	<meta name="description" content="Landing page to Muhammad Iqbal Bin Suhaidin's portfolio." />
	<style>
		:root {
			--bg1: #0b0f19;
			--bg2: #1f2937;
			--btn: #7c3aed;
			--btn2: #6366f1;
			--text: #e5e7eb;
		}
		* { box-sizing: border-box; }
		html, body { height: 100%; margin: 0; }
		body {
			display: grid; place-items: center; min-height: 100vh;
			background: radial-gradient(1000px 500px at 10% -10%, rgba(124,58,237,.25), transparent 50%),
									radial-gradient(900px 450px at 100% 0%, rgba(99,102,241,.25), transparent 50%),
									linear-gradient(160deg, var(--bg1), var(--bg2));
			color: var(--text);
			font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial, sans-serif;
			padding: 24px;
		}
		.wrap { text-align: center; }
		h1 { font-size: clamp(1.25rem, 2.3vw, 1.75rem); font-weight: 700; margin: 0 0 18px; letter-spacing: .4px; }
		.btn {
			display: inline-block;
			padding: clamp(14px, 3.5vw, 18px) clamp(24px, 4.8vw, 36px);
			font-size: clamp(1rem, 2.8vw, 1.4rem);
			font-weight: 800;
			color: white;
			background: linear-gradient(135deg, var(--btn), var(--btn2));
			border-radius: 999px;
			border: none;
			text-decoration: none;
			box-shadow: 0 12px 30px rgba(99,102,241,.35);
			transition: transform .12s ease, box-shadow .12s ease, opacity .2s ease;
		}
		.btn:hover { transform: translateY(-1px); box-shadow: 0 16px 36px rgba(99,102,241,.45); text-decoration: none; }
		.btn:active { transform: translateY(0); box-shadow: 0 8px 20px rgba(99,102,241,.35); }
		.sub { margin-top: 12px; opacity: .8; font-size: .95rem; }
	</style>
</head>
<body>
	<main class="wrap" aria-label="Landing">
		<h1>Welcome to my portfolio</h1>
		<a class="btn" href="main.html" aria-label="Go to portfolio main page">Enter Portfolio</a>
		<div class="sub">Click the button to view my work, experience, and projects.</div>
		<noscript>
			<p><a href="main.html">Continue to portfolio</a></p>
		</noscript>
	</main>
</body>
</html>
