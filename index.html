<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column; /* Stack elements vertically */
            justify-content: center; /* Center vertically */
            align-items: center;    /* Center horizontally */
            min-height: 100vh;      /* Ensure body takes full viewport height */
            padding: 20px;          /* Add some padding around the content */
        }

        .login-container {
            background-color: #ffffff;
            padding: 40px 50px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px; /* Max width for the form */
            text-align: center;
            margin-bottom: 30px; /* Add space below the login container */
        }

        .login-container h2 {
            color: #333;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
            position: relative;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 0.95em;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            color: #333;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .input-group input::placeholder {
            color: #aaa;
        }

        .input-group input:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 8px rgba(118, 75, 162, 0.2);
        }

        .login-button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s ease, transform 0.2s ease;
            margin-top: 10px;
        }

        .login-button:hover {
            opacity: 0.9;
        }

        .login-button:active {
            transform: scale(0.98);
        }

        .options {
            margin-top: 25px;
            font-size: 0.9em;
        }

        .options a {
            color: #667eea;
            text-decoration: none;
            margin: 0 10px;
            transition: color 0.3s ease;
        }

        .options a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        /* Style for the new navigation button */
        .nav-button {
            display: inline-block; /* Allows padding and margin */
            padding: 10px 25px;
            background-color: #ffffff; /* White background */
            color: #764ba2; /* Purple text */
            border: 2px solid #764ba2; /* Purple border */
            border-radius: 6px;
            text-decoration: none; /* Remove underline from link */
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .nav-button:hover {
            background-color: #f0eafa; /* Light purple on hover */
            color: #667eea; /* Lighter purple text on hover */
        }

    </style>
</head>
<body>

    <div class="login-container">
        <h2>Login</h2>
        <form action="#" method="post"> <!-- Replace # with your backend endpoint -->
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="login-button">Login</button>

            <div class="options">
                <a href="#">Forgot Password?</a>
                <span>|</span>
                <a href="#">Sign Up</a>
            </div>
        </form>
    </div> <!-- End of login-container -->

    <!-- New button linking to secondpage.html -->
    <a href="/secondpage.html" class="nav-button">Go to Second Page</a>

</body>
</html>
